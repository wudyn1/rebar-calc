  },

    "HPB300":  {6:[200,250,300],8:[250,350,400],10:[300,450,500],12:[350,500,600],14:[450,600,650],16:[500,650,750]},


    "HRB400E": {8:[300,400,450],10:[350,500,550],12:[400,600,650],14:[500,650,750],16:[550,750,850],20:[700,950,1100],25:[850,1200,1350],32:[1200,1700,1900],40:[1500,2100,2400]},


    "HRB500E": {8:[350,500,550],10:[450,600,700],12:[500,700,800],14:[600,850,950],16:[700,950,1050],20:[850,1150,1350],25:[1050,1450,1650],32:[1500,2100,2400],40:[1850,2600,2950]}

  "C50": {

    "HRB400E": {8:[250,350,400],10:[350,450,500],12:[400,550,600],14:[450,650,700],16:[500,650,800],20:[650,900,1000],25:[800,1100,1250],32:[1150,1600,1800],40:[1400,2000,2250]},


    "HRB500E": {8:[300,450,500],10:[400,550,600],12:[450,650,750],14:[550,750,850],16:[600,850,950],20:[750,1050,1200],25:[950,1300,1500],32:[1300,1800,2050],40:[1600,2250,2600]}

// ---- 常规岛廊道锚固长度表 ----


// 格式: ciAnchData[组别][钢筋级别][混凝土等级][d分类] = d倍数


var ciAnchData = {


  "G1": { // 第一组：BGZ,BDL,BGU,BDG,BDH,BGF,BGR,BGT-1、2外


    "HPB300": {


      "C40":{le25:26},  "C45":{le25:25},  "C50":{le25:24},


      "C55":{le25:23},  "C60":{le25:22}


    },


    "HRB400E": {


      "C40":{le25:30,gt25:34},"C45":{le25:29,gt25:33},"C50":{le25:28,gt25:32},


      "C55":{le25:27,gt25:30},"C60":{le25:26,gt25:29}


    }


  },


  "G2": { // 第二组：BGA/B/C,BGL/M/N,BGH/I/J,BGT-1、2,BGK,BGE


    "HPB300": {


      "C40":{le25:29},  "C45":{le25:28},  "C50":{le25:26},

// ---- 22G-101 弯曲心轴公式（常规岛+国标共用）----


function gbtPin(steel, d) {


  if (steel === "HPB300")  return Math.ceil(d * 2.5);


  if (steel === "HRB400E") return Math.ceil(d * 4);


  if (steel === "HRB500E") return d <= 25 ? Math.ceil(d * 6) : Math.ceil(d * 7);


  return d * 4;


}








// ---- 国标22G-101 锚固/搭接长度查表 ----


// la 表：[d<=25倍数, d>25倍数]（无d>25的填null）


var gbtLaTable = {


  "HPB300": {


    C25:[34,null], C30:[30,null], C35:[28,null], C40:[25,null], C45:[24,null],


    C50:[23,null], C55:[22,null], C60:[21,null]

    C50:[32,35], C55:[31,34], C60:[30,33]


  }


};


// laE 表（抗震锚固）：[抗震等级][d<=25倍数, d>25倍数]


var gbtLaETable = {


  "HPB300": {


    "12":[39,null,35,null,32,null,29,null,28,null,26,null,25,null,24,null],


    "3" :[36,null,32,null,29,null,26,null,25,null,24,null,23,null,22,null]


  },


  "HRB400E": {


    "12":[46,51,40,45,37,40,33,37,32,36,31,35,30,33,29,32],


    "3" :[42,46,37,41,34,37,30,34,29,33,28,32,27,30,26,29]


  },


  "HRB500E": {


    "12":[55,61,49,54,45,49,41,46,39,43,37,40,36,39,35,38],


    "3" :[50,56,45,49,41,45,38,42,36,39,34,37,33,36,32,35]


  }


};


// 混凝土等级顺序（la/laE表共用）


var gbtConcOrder = ["C25","C30","C35","C40","C45","C50","C55","C60"];





function gbtLookup(steel, dia, conc, jtype) {


  var le25 = dia <= 25;


  var idx = gbtConcOrder.indexOf(conc);


  if (idx < 0) return null;





  // Read seismic grade from selector


  var seismicGrade = "4";


  var seismicSel = document.getElementById("ancSeismic");


  if (seismicSel) seismicGrade = seismicSel.value;





  var laMult;


  if (seismicGrade === "4") {


    // Non-seismic: use gbtLaTable


    var laRow = gbtLaTable[steel];


    if (!laRow) return null;


    var laCell = laRow[conc];


    if (!laCell) return null;


    laMult = le25 ? laCell[0] : (laCell[1] !== null && laCell[1] !== undefined ? laCell[1] : null);


  } else {


    // Seismic (laE): use gbtLaETable


    var eRow = gbtLaETable[steel];


    if (!eRow) return null;


    var eArr = eRow[seismicGrade];


    if (!eArr) return null;


    var eIdx = idx * 2 + (le25 ? 0 : 1);


    laMult = eArr[eIdx];


  }


  if (laMult === null || laMult === undefined) return null;


  var laVal = dia * laMult;





  if (jtype === "la") return Math.ceil(laVal);





  // Lap multiplier


  var lapMap = {lap:1.4, lap25:1.2, lap50:1.4, lap100:1.6};


  var lm = lapMap[jtype];


  if (!lm) lm = 1.4;


  return Math.ceil(laVal * lm);


}





// ---- 核岛弯钩平直段（台山核电二期项目规范）----


function nuclearHookStraight(steel, angle, dia) {


  // HPB300 / HRB400E / HRB500E 相同


  if (angle == 90)  return 12;


  if (angle == 135) return 10;


  if (angle == 180) return (dia && dia * 5 < 50) ? 50 / dia : 5;


  return 12;


}

var currentMode = "nuclear";


var calcExpr = "";





// ============================================================


// 模式切换


// ============================================================


function setMode(m) {


  currentMode = m;


  localStorage.setItem("rebarCalcMode", m);

  // 刷新当前卡片结果


  if (m === "calc") {


    document.getElementById("calcDisplay").value = "";


    calcExpr = "";


  } else {


    updatePinResult();


    updateAncResult();


    updateHookResult();


  }


}





function updateModeUI() {

  document.querySelectorAll(".mode-btn").forEach(function(btn) {


    btn.classList.remove("active");


  });

  else if (currentMode === "ci")     btns[1].classList.add("active");

  document.getElementById("hookCard").style.display = isCalc ? "none" : "block";

  } else {


    aux.innerHTML = "";


  }





  // 钢筋下拉选项过滤

  updateAncJtypeOptions();


}





function updateSteelOptions() {


  var steels = ["HRB500E","HRB400E","HPB300"];


  var opts = {};


  if (currentMode === "ci") {


    opts = ["HRB400E","HPB300"];


  } else {


    opts = steels;


  }


  ["pinSteel","ancSteel","hookSteel"].forEach(function(selId) {


    var sel = document.getElementById(selId);


    if (!sel) return;


    var cur = sel.value;


    sel.innerHTML = "";


    opts.forEach(function(s) {


      var label = s;


      var opt = document.createElement("option");


      opt.value = s; opt.textContent = label;


      sel.appendChild(opt);


    });


    // 恢复原选值或默认


    sel.selectedIndex = 0;


  });


  filterDiaOptions();


}


// 动态过滤直径选项（Mod1）


function filterDiaOptions() {


  var steel = document.getElementById("pinSteel") ? document.getElementById("pinSteel").value : "";


  var conc  = document.getElementById("pinConc")  ? document.getElementById("pinConc").value  : "";


  var allDia = [6,8,10,12,14,16,18,20,22,25,28,32,36,40];


  var nuclearDiaMap = {


    "HPB300":  {C40:[6,8,10,12,14,16],C45:[6,8,10,12,14,16],C50:[6,8,10,12,14,16],C60:[6,8,10,12,14,16]},


    "HRB400E": {C40:[8,10,12,14,16,20,25,32,40],C45:[8,10,12,14,16,20,25,32,40],C50:[8,10,12,14,16,20,25,32,40],C60:[8,10,12,14,16,20,25,32,40]},


    "HRB500E": {C40:[8,10,12,14,16,20,25,32,40],C45:[8,10,12,14,16,20,25,32,40],C50:[8,10,12,14,16,20,25,32,40],C60:[8,10,12,14,16,20,25,32,40]}


  };


  var validDia = allDia;


  if (currentMode === "nuclear" && nuclearDiaMap[steel] && nuclearDiaMap[steel][conc]) {


    validDia = nuclearDiaMap[steel][conc];


  }


  ["pinDia","ancDia","hookDia"].forEach(function(id) {


    var inp = document.getElementById(id);


    if (!inp) return;


    var cur = parseInt(inp.value) || 0;


    var min = validDia.length > 0 ? validDia[0] : 6;


    var max = validDia.length > 0 ? validDia[validDia.length-1] : 50;


    inp.min = min;


    inp.max = max;


    if (validDia.indexOf(cur) < 0) {


      cur = validDia.reduce(function(a,b){return Math.abs(b-cur)<Math.abs(a-cur)?b:a;});


      inp.value = cur;


    }


  });


}


function updateAncJtypeOptions() {


  var sel = document.getElementById("ancJtype");


  if (!sel) return;


  if (currentMode === "nuclear") {


    sel.innerHTML = '<option value="la">锚固长度</option><option value="lap50">搭接（≤50%）</option><option value="lap50plus">搭接（＞50%）</option>';

  } else if (currentMode === "ci") {


    sel.innerHTML = '<option value="la">锚固长度</option><option value="lap25">搭接（25%）</option><option value="lap50">搭接（50%）</option><option value="lap100">搭接（100%）</option>';

  } else {


    sel.innerHTML = '<option value="la">锚固长度</option><option value="lap25">搭接（25%）</option><option value="lap50">搭接（50%）</option><option value="lap100">搭接（100%）</option>';

  }





    var seismicSel = document.getElementById("ancSeismic");


    var seismicLabel = document.getElementById("seismicLabel");


    if (seismicSel) {


      if (currentMode === "gbt") {


        seismicSel.style.display = "";


        if (seismicLabel) seismicLabel.style.display = "";


      } else {

        if (seismicLabel) seismicLabel.style.display = "none";


      }


    }


  


  // Filter concrete grades by mode


  var concSel = document.getElementById("ancConc");


  if (concSel) {

    if (currentMode === "nuclear") {


      concSel.innerHTML = '<option value="C40">C40</option><option value="C45">C45</option><option value="C50">C50</option><option value="C60">C60</option>';


    } else if (currentMode === "ci") {


      concSel.innerHTML = '<option value="C40">C40</option><option value="C45">C45</option><option value="C50">C50</option><option value="C55">C55</option><option value="C60">C60</option>';


    } else {


      concSel.innerHTML = '<option value="C25">C25</option><option value="C30">C30</option><option value="C35">C35</option><option value="C40">C40</option><option value="C45">C45</option><option value="C50">C50</option><option value="C55">C55</option><option value="C60">C60</option>';


    }


    // Restore saved value if still valid


    for (var o of concSel.options) { if (o.value === savedVal) { concSel.value = savedVal; break; } }


  }


}








// ============================================================


// 查表/计算函数


// ============================================================





// ---- 弯曲心轴 ----


function getPinMM(steel, dia, purpose) {


  purpose = purpose || "main";


  if (currentMode === "nuclear") {


    var d = nuclearPinData[steel];


    if (!d) return null;


    d = d[purpose];


    return d && d[dia] !== undefined ? d[dia] : null;


  } else {


    return gbtPin(steel, dia);


  }


}





function updatePinResult() {


  var steel = document.getElementById("pinSteel").value;


  var dia   = parseInt(document.getElementById("pinDia").value) || 0;


  var purpose = currentMode === "nuclear"


    ? (document.getElementById("pinPurpose") ? document.getElementById("pinPurpose").value : "main")


    : "main";


  var val = getPinMM(steel, dia, purpose);


  var el  = document.getElementById("pinResult");


  var note = document.getElementById("pinNote");


  if (!val) {


    el.textContent = "—"; note.textContent = "无数据，请核对该规格";


    return;


  }


  el.textContent = val;


  var src = currentMode === "nuclear" ? "台山核电二期核岛规范" : "22G-101图集";


  note.textContent = "来源：" + src + "　用途：" + (purpose === "main" ? "主筋" : "箍筋/拉筋");


}





// ---- 锚固/搭接长度 ----


function getAncMM(steel, dia, conc, jtype) {


  conc = conc || "C40"; jtype = jtype || "la";


  if (currentMode === "nuclear") {


    var d = nuclearAnchData[conc];


    if (!d) return null;


    d = d[steel];


    if (!d) return null;


    d = d[dia];


    if (!d) return null;


    if (jtype === "la") return d[0];


    if (jtype === "lap50") return d[1] || d[0];


    if (jtype === "lap50plus") return d[2] || d[1] || d[0];


    return d[0];





  } else if (currentMode === "ci") {


    var grp = document.getElementById("ciGroup") ? document.getElementById("ciGroup").value : "G1";


    var g = ciAnchData[grp];


    if (!g) return null;


    g = g[steel];


    if (!g) return null;


    g = g[conc];


    if (!g) return null;


    var mult = dia <= 25 ? g.le25 : (g.gt25 !== undefined ? g.gt25 : g.le25);


    var ancVal = Math.ceil(dia * mult);


    if (jtype === "la") return ancVal;


    var ciLapMap = {lap:1.4, lap25:1.2, lap50:1.4, lap100:1.6};


    var ciLm = ciLapMap[jtype] || 1.4;


    return Math.ceil(ancVal * ciLm);


  } else {


    // 国标22G-101完整锚固/搭接长度表


    return gbtLookup(steel, dia, conc, jtype);


  }


}





function updateAncResult() {


  var steel = document.getElementById("ancSteel").value;


  var dia   = parseInt(document.getElementById("ancDia").value) || 0;


  var conc  = document.getElementById("ancConc").value;


  var jtype = document.getElementById("ancJtype").value;


  var val   = getAncMM(steel, dia, conc, jtype);


  var el    = document.getElementById("ancResult");


  var note  = document.getElementById("ancNote");


  if (val === null) {


    el.textContent = "—"; note.textContent = "无数据，请核对该规格";


    return;


  }


  el.textContent = val;


    var jtypeLabel = jtype === "la" ? "锚固长度" : jtype === "lap50" ? "搭接（≤50%）" : jtype === "lap50plus" ? "搭接（＞50%）" : "搭接长度";


  var src = currentMode === "nuclear" ? "台山核电二期核岛规范" :


            currentMode === "ci" ? "常规岛廊道表（" +


            (document.getElementById("ciGroup") && document.getElementById("ciGroup").value === "G2"


              ? "第二组" : "第一组") + "）" : "国标22G-101规范表";


  note.textContent = "来源：" + src + "　" + jtypeLabel;


}





// ---- 弯钩外皮尺寸 ----


function updateHookResult() {


  var steel = document.getElementById("hookSteel").value;


  var dia   = parseInt(document.getElementById("hookDia").value) || 0;


  var angle = parseInt(document.getElementById("hookAngle").value) || 90;


  var el    = document.getElementById("hookResult");


  var note  = document.getElementById("hookNote");





  if (currentMode === "nuclear") {


    var purpose = document.getElementById("pinPurpose") ? document.getElementById("pinPurpose").value : "main";


    var D = getPinMM(steel, dia, purpose);


    var straight = nuclearHookStraight(steel, angle, dia);


    if (!D) { el.textContent = "—"; note.textContent = "无弯曲心轴数据"; return; }


    var outer = dia * straight + D / 2 + dia;


    outer = Math.round(outer);


    el.textContent = outer;


    note.textContent = "公式：平直段" + straight + "d + D/2 + d = " + dia + "×" + straight + " + " + D + "/2 + " + dia + " = " + outer + "mm";


  } else {


    // 常规岛/国标：弯钩平直段参照核岛规范


    var straight2 = nuclearHookStraight(steel, angle, dia);


    var D2 = gbtPin(steel, dia);


    var outer2 = dia * straight2 + D2 / 2 + dia;


    outer2 = Math.round(outer2);


    el.textContent = outer2;


    var src2 = currentMode === "ci" ? "常规岛" : "国标";


    note.textContent = src2 + "，平直段" + straight2 + "d，D=" + D2 + "mm，D/2+d=" + Math.round(D2/2+dia) + "mm";


  }


}





// ============================================================


// 普通计算器


// ============================================================


function calcNum(n) {


  calcExpr += n;


  document.getElementById("calcDisplay").value = calcExpr;


}


function calcOp(op) {


  if (op === "**2") {


    calcExpr += "**2";


  } else if (op === "**") {


    calcExpr += "**";


  } else {


    calcExpr += op;


  }


  document.getElementById("calcDisplay").value = calcExpr;


}


function calcEval() {


  try {


    var r = eval(calcExpr);


    document.getElementById("calcDisplay").value = (typeof r === "number" && isFinite(r)) ? r.toFixed(10).replace(/\.?0+$/, "") : r;


    calcExpr = document.getElementById("calcDisplay").value;


  } catch(e) {


    document.getElementById("calcDisplay").value = "Error";


    calcExpr = "";


  }


}


function calcC() { calcExpr = ""; document.getElementById("calcDisplay").value = ""; }


function calcBack() {


  calcExpr = calcExpr.slice(0, -1);


  document.getElementById("calcDisplay").value = calcExpr;


}


function calcSqrt() {


  try {


    var r = Math.sqrt(eval(calcExpr));


    document.getElementById("calcDisplay").value = isFinite(r) ? r.toFixed(10).replace(/\.?0+$/, "") : "Error";


    calcExpr = document.getElementById("calcDisplay").value;


  } catch(e) { document.getElementById("calcDisplay").value = "Error"; calcExpr = ""; }


}


function calcPi() { calcExpr += "3.1415926535"; document.getElementById("calcDisplay").value = calcExpr; }





// 键盘支持（仅计算器模式）


document.addEventListener("keydown", function(e) {


  if (currentMode !== "calc") return;


  var k = e.key;


  if (/^[0-9.]$/.test(k)) { calcNum(k); e.preventDefault(); }


  else if (k === "+") calcOp("+");


  else if (k === "-") calcOp("-");


  else if (k === "*") calcOp("*");


  else if (k === "/") calcOp("/");


  else if (k === "(" || k === ")") calcOp(k);


  else if (k === "Enter" || k === "=") { calcEval(); e.preventDefault(); }


  else if (k === "Backspace") { calcBack(); e.preventDefault(); }


  else if (k === "Escape" || k === "Delete") { calcC(); e.preventDefault(); }


  else if (k === "s" || k === "S") { calcSqrt(); e.preventDefault(); }


});
